name: "Install SDL Packages"
description: "Install SDL packages"
author: "Scott Doxey @neogeek"
branding:
  color: blue
  icon: upload-cloud

inputs:
  BUILD_SDL_FOR_EMSCRIPTEN:
    description: "If the action should build the SDL packages for Emscripten."
    required: false
    default: "false"
  SDL_VERSION:
    description: "SDL version"
    required: false
    default: "3.4.12"
  CACHE_SDL:
    description: "If the action should cache the SDL files."
    required: false
    default: "true"
  SDL_IMAGE_VERSION:
    description: "SDL_image version"
    required: false
    default: "3.4.4"
  CACHE_SDL_IMAGE:
    description: "If the action should cache the SDL_image files."
    required: false
    default: "true"
  SDL_TTF_VERSION:
    description: "SDL_ttf version"
    required: false
    default: "3.2.2"
  CACHE_SDL_TTF:
    description: "If the action should cache the SDL_ttf files."
    required: false
    default: "true"
  SDL_MIXER_VERSION:
    description: "SDL_mixer version"
    required: false
    default: "3.2.4"
  CACHE_SDL_MIXER:
    description: "If the action should cache the SDL_mixer files."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential make cmake pkg-config ninja-build
        if [[ "${SDL_VERSION}" == 3* ]]; then
          sudo apt-get install -y \
            libasound2-dev libpulse-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgles2-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev
        fi
        if [[ "${SDL_TTF_VERSION}" == 3* || "${SDL_TTF_VERSION}" == 2* ]]; then
          sudo apt-get install -y libfreetype6-dev libharfbuzz-dev
        fi
      env:
        SDL_VERSION: ${{ inputs.SDL_VERSION }}
        SDL_TTF_VERSION: ${{ inputs.SDL_TTF_VERSION }}

    - if: ${{ (inputs.BUILD_SDL_FOR_EMSCRIPTEN == 'true' || inputs.BUILD_SDL_FOR_EMSCRIPTEN == true) }}
      name: Install Emscripten
      uses: HandcrankEngine/install-emscripten-package@36cc758cb3c58a74460fa8d033120d0f2b281005 # v0.2.0

    - if: ${{ inputs.SDL_VERSION != '' }}
      name: Restore SDL Cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-sdl
      with:
        path: /tmp/.sdl/SDL-${{ inputs.SDL_VERSION }}
        key: sdl-${{ inputs.SDL_VERSION }}-${{ runner.os }}${{ (inputs.BUILD_SDL_FOR_EMSCRIPTEN == 'true' || inputs.BUILD_SDL_FOR_EMSCRIPTEN == true) && '-emscripten' || '-native' }}

    - if: ${{ inputs.SDL_VERSION != '' && steps.cache-sdl.outputs.cache-hit != 'true' }}
      name: Install SDL
      shell: bash
      run: |
        mkdir -p /tmp/.sdl
        cd /tmp/.sdl

        if [[ "${SDL_VERSION}" == 2* ]]; then
          curl -L https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz > SDL.tar.gz
        elif [[ "${SDL_VERSION}" == 3* ]]; then
          curl -L https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz > SDL.tar.gz
        else
          echo "Unsupported SDL version: ${SDL_VERSION}"
          exit 1
        fi

        mkdir SDL-${SDL_VERSION}
        tar -xzvf SDL.tar.gz --strip-components=1 -C SDL-${SDL_VERSION}
        cd SDL-${SDL_VERSION}

        INSTALL_PREFIX="/tmp/.sdl/SDL-${SDL_VERSION}"

        if [[ "${BUILD_SDL_FOR_EMSCRIPTEN}" == "true" ]]; then
          emcmake cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON
          cmake --build build -j$(nproc)
          cmake --install build
        elif [[ "${SDL_VERSION}" == 2* ]]; then
          ./configure --prefix="${INSTALL_PREFIX}"
          make -j$(nproc)
          make install
        elif [[ "${SDL_VERSION}" == 3* ]]; then
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL3_SHARED=ON \
            -DSDL3_STATIC=ON
          cmake --build build -j$(nproc)
          cmake --install build
        fi
      env:
        SDL_VERSION: ${{ inputs.SDL_VERSION }}
        BUILD_SDL_FOR_EMSCRIPTEN: ${{ inputs.BUILD_SDL_FOR_EMSCRIPTEN }}

    - if: ${{ inputs.SDL_VERSION != '' && inputs.CACHE_SDL != 'false' && steps.cache-sdl.outputs.cache-hit != 'true' }}
      name: Store SDL Cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/.sdl/SDL-${{ inputs.SDL_VERSION }}
        key: sdl-${{ inputs.SDL_VERSION }}-${{ runner.os }}${{ (inputs.BUILD_SDL_FOR_EMSCRIPTEN == 'true' || inputs.BUILD_SDL_FOR_EMSCRIPTEN == true) && '-emscripten' || '-native' }}

    - if: ${{ inputs.SDL_IMAGE_VERSION != '' }}
      name: Restore SDL_image Cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-sdl-image
      with:
        path: /tmp/.sdl/SDL_image-${{ inputs.SDL_IMAGE_VERSION }}
        key: sdl-image-${{ inputs.SDL_IMAGE_VERSION }}-${{ runner.os }}${{ (inputs.BUILD_SDL_FOR_EMSCRIPTEN == 'true' || inputs.BUILD_SDL_FOR_EMSCRIPTEN == true) && '-emscripten' || '-native' }}

    - if: ${{ inputs.SDL_IMAGE_VERSION != '' && steps.cache-sdl-image.outputs.cache-hit != 'true' }}
      name: Install SDL_image
      shell: bash
      run: |
        mkdir -p /tmp/.sdl
        cd /tmp/.sdl

        if [[ "${SDL_IMAGE_VERSION}" == 2* ]]; then
          curl -L https://github.com/libsdl-org/SDL_image/releases/download/release-${SDL_IMAGE_VERSION}/SDL2_image-${SDL_IMAGE_VERSION}.tar.gz > SDL_image.tar.gz
        elif [[ "${SDL_IMAGE_VERSION}" == 3* ]]; then
          curl -L https://github.com/libsdl-org/SDL_image/releases/download/release-${SDL_IMAGE_VERSION}/SDL3_image-${SDL_IMAGE_VERSION}.tar.gz > SDL_image.tar.gz
        else
          echo "Unsupported SDL_image version: ${SDL_IMAGE_VERSION}"
          exit 1
        fi

        mkdir SDL_image-${SDL_IMAGE_VERSION}
        tar -xzvf SDL_image.tar.gz --strip-components=1 -C SDL_image-${SDL_IMAGE_VERSION}
        cd SDL_image-${SDL_IMAGE_VERSION}

        INSTALL_PREFIX="/tmp/.sdl/SDL_image-${SDL_IMAGE_VERSION}"

        if [[ "${BUILD_SDL_FOR_EMSCRIPTEN}" == "true" ]]; then
          if [[ "${SDL_IMAGE_VERSION}" == 2* ]]; then
            emcmake cmake -S . -B build \
              -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
              -DSDL2_DIR="/tmp/.sdl/SDL-${SDL_VERSION}/lib/cmake/SDL2" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DSDL2IMAGE_SAMPLES=OFF
          else
            emcmake cmake -S . -B build \
              -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
              -DSDL3_DIR="/tmp/.sdl/SDL-${SDL_VERSION}/lib/cmake/SDL3" \
              -DCMAKE_BUILD_TYPE=Release \
              -DSDL3IMAGE_SHARED=OFF \
              -DSDL3IMAGE_BUILD_SHARED_LIBS=OFF \
              -DSDLIMAGE_SAMPLES=OFF
          fi
          cmake --build build -j$(nproc)
          cmake --install build
        elif [[ "${SDL_IMAGE_VERSION}" == 2* ]]; then
          ./configure --prefix="${INSTALL_PREFIX}"
          make -j$(nproc)
          make install
        elif [[ "${SDL_IMAGE_VERSION}" == 3* ]]; then
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL3_SHARED=ON \
            -DSDL3_STATIC=ON
          cmake --build build -j$(nproc)
          cmake --install build
        fi
      env:
        SDL_VERSION: ${{ inputs.SDL_VERSION }}
        SDL_IMAGE_VERSION: ${{ inputs.SDL_IMAGE_VERSION }}
        BUILD_SDL_FOR_EMSCRIPTEN: ${{ inputs.BUILD_SDL_FOR_EMSCRIPTEN }}
        PKG_CONFIG_PATH: /tmp/.sdl/SDL-${{ inputs.SDL_VERSION }}/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH
        CMAKE_PREFIX_PATH: /tmp/.sdl/SDL-${{ inputs.SDL_VERSION }}:$CMAKE_PREFIX_PATH

    - if: ${{ inputs.SDL_IMAGE_VERSION != '' && inputs.CACHE_SDL_IMAGE != 'false' && steps.cache-sdl-image.outputs.cache-hit != 'true' }}
      name: Store SDL_image Cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/.sdl/SDL_image-${{ inputs.SDL_IMAGE_VERSION }}
        key: sdl-image-${{ inputs.SDL_IMAGE_VERSION }}-${{ runner.os }}${{ (inputs.BUILD_SDL_FOR_EMSCRIPTEN == 'true' || inputs.BUILD_SDL_FOR_EMSCRIPTEN == true) && '-emscripten' || '-native' }}

    - if: ${{ inputs.SDL_TTF_VERSION != '' }}
      name: Restore SDL_ttf Cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-sdl-ttf
      with:
        path: /tmp/.sdl/SDL_ttf-${{ inputs.SDL_TTF_VERSION }}
        key: sdl-ttf-${{ inputs.SDL_TTF_VERSION }}-${{ runner.os }}${{ (inputs.BUILD_SDL_FOR_EMSCRIPTEN == 'true' || inputs.BUILD_SDL_FOR_EMSCRIPTEN == true) && '-emscripten' || '-native' }}

    - if: ${{ inputs.SDL_TTF_VERSION != '' && steps.cache-sdl-ttf.outputs.cache-hit != 'true' }}
      name: Install SDL_ttf
      shell: bash
      run: |
        mkdir -p /tmp/.sdl
        cd /tmp/.sdl

        if [[ "${SDL_TTF_VERSION}" == 2* ]]; then
          curl -L https://github.com/libsdl-org/SDL_ttf/releases/download/release-${SDL_TTF_VERSION}/SDL2_ttf-${SDL_TTF_VERSION}.tar.gz > SDL_ttf.tar.gz
        elif [[ "${SDL_TTF_VERSION}" == 3* ]]; then
          curl -L https://github.com/libsdl-org/SDL_ttf/releases/download/release-${SDL_TTF_VERSION}/SDL3_ttf-${SDL_TTF_VERSION}.tar.gz > SDL_ttf.tar.gz
        else
          echo "Unsupported SDL_ttf version: ${SDL_TTF_VERSION}"
          exit 1
        fi

        mkdir SDL_ttf-${SDL_TTF_VERSION}
        tar -xzvf SDL_ttf.tar.gz --strip-components=1 -C SDL_ttf-${SDL_TTF_VERSION}
        cd SDL_ttf-${SDL_TTF_VERSION}

        INSTALL_PREFIX="/tmp/.sdl/SDL_ttf-${SDL_TTF_VERSION}"

        if [[ "${BUILD_SDL_FOR_EMSCRIPTEN}" == "true" ]]; then
          if [[ "${SDL_TTF_VERSION}" == 2* ]]; then
            emcmake cmake -S . -B build \
              -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
              -DCMAKE_PREFIX_PATH="/tmp/.sdl/SDL-${SDL_VERSION}" \
              -DSDL2_DIR="/tmp/.sdl/SDL-${SDL_VERSION}/lib/cmake/SDL2" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DSDL2TTF_SAMPLES=OFF \
              -DCMAKE_C_FLAGS="-sUSE_FREETYPE=1 -sUSE_HARFBUZZ=1" \
              -DCMAKE_CXX_FLAGS="-sUSE_FREETYPE=1 -sUSE_HARFBUZZ=1" \
              -DSDL2TTF_HARFBUZZ=ON
          else
            emcmake cmake -S . -B build \
              -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
              -DSDL3_DIR="/tmp/.sdl/SDL-${SDL_VERSION}/lib/cmake/SDL3" \
              -DCMAKE_BUILD_TYPE=Release \
              -DSDL3TTF_SHARED=OFF \
              -DSDLTTF_SAMPLES=OFF \
              -DCMAKE_C_FLAGS="-sUSE_FREETYPE=1 -sUSE_HARFBUZZ=1" \
              -DCMAKE_CXX_FLAGS="-sUSE_FREETYPE=1 -sUSE_HARFBUZZ=1" \
              -DSDL3TTF_HARFBUZZ=ON
          fi
          cmake --build build -j$(nproc)
          cmake --install build
        elif [[ "${SDL_TTF_VERSION}" == 2* ]]; then
          ./configure --prefix="${INSTALL_PREFIX}"
          make -j$(nproc)
          make install
        elif [[ "${SDL_TTF_VERSION}" == 3* ]]; then
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL3_SHARED=ON \
            -DSDL3_STATIC=ON
          cmake --build build -j$(nproc)
          cmake --install build
        fi
      env:
        SDL_VERSION: ${{ inputs.SDL_VERSION }}
        SDL_TTF_VERSION: ${{ inputs.SDL_TTF_VERSION }}
        BUILD_SDL_FOR_EMSCRIPTEN: ${{ inputs.BUILD_SDL_FOR_EMSCRIPTEN }}
        PKG_CONFIG_PATH: /tmp/.sdl/SDL-${{ inputs.SDL_VERSION }}/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH
        CMAKE_PREFIX_PATH: /tmp/.sdl/SDL-${{ inputs.SDL_VERSION }}:$CMAKE_PREFIX_PATH

    - if: ${{ inputs.SDL_TTF_VERSION != '' && inputs.CACHE_SDL_TTF != 'false' && steps.cache-sdl-ttf.outputs.cache-hit != 'true' }}
      name: Store SDL_ttf Cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/.sdl/SDL_ttf-${{ inputs.SDL_TTF_VERSION }}
        key: sdl-ttf-${{ inputs.SDL_TTF_VERSION }}-${{ runner.os }}${{ (inputs.BUILD_SDL_FOR_EMSCRIPTEN == 'true' || inputs.BUILD_SDL_FOR_EMSCRIPTEN == true) && '-emscripten' || '-native' }}

    - if: ${{ inputs.SDL_MIXER_VERSION != '' }}
      name: Restore SDL_mixer Cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-sdl-mixer
      with:
        path: /tmp/.sdl/SDL_mixer-${{ inputs.SDL_MIXER_VERSION }}
        key: sdl-mixer-${{ inputs.SDL_MIXER_VERSION }}-${{ runner.os }}${{ (inputs.BUILD_SDL_FOR_EMSCRIPTEN == 'true' || inputs.BUILD_SDL_FOR_EMSCRIPTEN == true) && '-emscripten' || '-native' }}

    - if: ${{ inputs.SDL_MIXER_VERSION != '' && steps.cache-sdl-mixer.outputs.cache-hit != 'true' }}
      name: Install SDL_mixer
      shell: bash
      run: |
        mkdir -p /tmp/.sdl
        cd /tmp/.sdl

        if [[ "${SDL_MIXER_VERSION}" == 2* ]]; then
          curl -L https://github.com/libsdl-org/SDL_mixer/releases/download/release-${SDL_MIXER_VERSION}/SDL2_mixer-${SDL_MIXER_VERSION}.tar.gz > SDL_mixer.tar.gz
        elif [[ "${SDL_MIXER_VERSION}" == 3* ]]; then
          curl -L https://github.com/libsdl-org/SDL_mixer/releases/download/release-${SDL_MIXER_VERSION}/SDL3_mixer-${SDL_MIXER_VERSION}.tar.gz > SDL_mixer.tar.gz
        else
          echo "Unsupported SDL_mixer version: ${SDL_MIXER_VERSION}"
          exit 1
        fi

        mkdir SDL_mixer-${SDL_MIXER_VERSION}
        tar -xzvf SDL_mixer.tar.gz --strip-components=1 -C SDL_mixer-${SDL_MIXER_VERSION}
        cd SDL_mixer-${SDL_MIXER_VERSION}

        INSTALL_PREFIX="/tmp/.sdl/SDL_mixer-${SDL_MIXER_VERSION}"

        if [[ "${BUILD_SDL_FOR_EMSCRIPTEN}" == "true" ]]; then
          if [[ "${SDL_MIXER_VERSION}" == 2* ]]; then
            emcmake cmake -S . -B build \
              -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
              -DCMAKE_PREFIX_PATH="/tmp/.sdl/SDL-${SDL_VERSION}" \
              -DSDL2_DIR="/tmp/.sdl/SDL-${SDL_VERSION}/lib/cmake/SDL2" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DSDL2MIXER_SAMPLES=OFF \
              -DSDL2MIXER_VENDORED=ON \
              -DSDL2MIXER_OPUS=OFF \
              -DSDL2MIXER_FLAC=OFF \
              -DSDL2MIXER_GME=OFF \
              -DSDL2MIXER_MOD=OFF \
              -DSDL2MIXER_MIDI=OFF \
              -DSDL2MIXER_VORBIS=OFF \
              -DSDL2MIXER_WAVPACK=OFF \
              -DSDL2MIXER_WAV=ON
          else
            emcmake cmake -S . -B build \
              -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
              -DSDL3_DIR="/tmp/.sdl/SDL-${SDL_VERSION}/lib/cmake/SDL3" \
              -DCMAKE_BUILD_TYPE=Release \
              -DSDL3MIXER_SHARED=OFF \
              -DSDLMIXER_SAMPLES=OFF
          fi
          cmake --build build -j$(nproc)
          cmake --install build
        elif [[ "${SDL_MIXER_VERSION}" == 2* ]]; then
          ./configure --prefix="${INSTALL_PREFIX}"
          make -j$(nproc)
          make install
        elif [[ "${SDL_MIXER_VERSION}" == 3* ]]; then
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL3_SHARED=ON \
            -DSDL3_STATIC=ON
          cmake --build build -j$(nproc)
          cmake --install build
        fi
      env:
        SDL_VERSION: ${{ inputs.SDL_VERSION }}
        SDL_MIXER_VERSION: ${{ inputs.SDL_MIXER_VERSION }}
        BUILD_SDL_FOR_EMSCRIPTEN: ${{ inputs.BUILD_SDL_FOR_EMSCRIPTEN }}
        PKG_CONFIG_PATH: /tmp/.sdl/SDL-${{ inputs.SDL_VERSION }}/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH
        CMAKE_PREFIX_PATH: /tmp/.sdl/SDL-${{ inputs.SDL_VERSION }}:$CMAKE_PREFIX_PATH

    - if: ${{ inputs.SDL_MIXER_VERSION != '' && inputs.CACHE_SDL_MIXER != 'false' && steps.cache-sdl-mixer.outputs.cache-hit != 'true' }}
      name: Store SDL_mixer Cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/.sdl/SDL_mixer-${{ inputs.SDL_MIXER_VERSION }}
        key: sdl-mixer-${{ inputs.SDL_MIXER_VERSION }}-${{ runner.os }}${{ (inputs.BUILD_SDL_FOR_EMSCRIPTEN == 'true' || inputs.BUILD_SDL_FOR_EMSCRIPTEN == true) && '-emscripten' || '-native' }}

    - name: Setup Environment Variables
      shell: bash
      run: |
        echo "SDL_PATH=/tmp/.sdl/SDL-${SDL_VERSION}" >> $GITHUB_ENV
        echo "SDL_IMAGE_PATH=/tmp/.sdl/SDL_image-${SDL_IMAGE_VERSION}" >> $GITHUB_ENV
        echo "SDL_TTF_PATH=/tmp/.sdl/SDL_ttf-${SDL_TTF_VERSION}" >> $GITHUB_ENV
        echo "SDL_MIXER_PATH=/tmp/.sdl/SDL_mixer-${SDL_MIXER_VERSION}" >> $GITHUB_ENV
      env:
        SDL_VERSION: ${{ inputs.SDL_VERSION }}
        SDL_IMAGE_VERSION: ${{ inputs.SDL_IMAGE_VERSION }}
        SDL_TTF_VERSION: ${{ inputs.SDL_TTF_VERSION }}
        SDL_MIXER_VERSION: ${{ inputs.SDL_MIXER_VERSION }}
